# Optimized Configuration for M5 Demand Forecasting

data:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  train_size: 0.8
  validation_size: 0.1
  test_size: 0.1

  subsample:
    enabled: true
    max_items: 1000        # tăng từ 400 → đủ học pattern
    strategy: random       # tránh bias theo time
    random_seed: 42

features:
  feature_version: "feat_m5"
  lag_features:
    lags: [1, 7, 14, 28]

  rolling_features:
    windows: [7, 14, 28]
    functions: ["mean", "std"]

  calendar_features:
    - day_of_week
    - day_of_month
    - month
    - week_of_year
    - is_weekend
    - is_month_start
    - is_month_end

model:
  xgboost:
    objective: "reg:squarederror"
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    early_stopping_rounds: 50
    eval_metric: "rmse"

  lightgbm:
    objective: "regression"
    metric: "rmse"
    n_estimators: 300
    max_depth: -1
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    early_stopping_rounds: 50

training:
  n_splits: 5
  test_size: 28
  validation_size: 28
  target_col: "demand"
  id_col: "id"
  date_col: "date"

evaluation:
  metrics:
    - rmse
    - mae
    - mape
    - wmape

paths:
  models_dir: "models"
  logs_dir: "logs"
  results_dir: "results"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

mlflow:
  enabled: true
  tracking_uri: "file:./mlruns"
  experiment_name: "retail-demand-forecasting"
  register_models: true
  registered_model_prefix: "retail_demand"